services:
  server:
    build:
      context: ./server
      args:
        NODE_ENV: ${NODE_ENV:-production}
    container_name: foody-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      MONGO_URI: ${MONGO_URI}
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        NODE_ENV: ${NODE_ENV:-production}
    container_name: foody-client
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped
